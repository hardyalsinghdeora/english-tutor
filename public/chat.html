<!doctype html>
<html lang="en">
<head>
<title>Talk to Emma</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/avatar.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/"><img src="/avatar.svg" alt=""><span>English with Emma</span></a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/lessons">Lessons</a>
      <a href="/chat" aria-current="page">Talk to Emma</a>
    </nav>
    <div class="account" id="account"></div>
  </div>
</header>
<main class="wrap chat-page">
  <div class="chat-box">
    <div class="chat-top">
      <img src="/avatar.svg" alt="">
      <div><b>Emma</b><small>● Your English tutor</small></div>
      <span class="tag context" id="context" hidden></span>
      <button type="button" class="icon-btn" id="settings-btn" aria-expanded="false" aria-controls="settings" title="Voice and microphone settings">⚙️</button>
    </div>
    <div class="settings" id="settings" hidden>
      <label class="row">Emma's voice
        <span class="voice-pick"><select id="voice-select" aria-label="Emma's voice"></select>
        <button type="button" class="chip" id="voice-test">▶ Test</button></span>
      </label>
      <label class="check"><input type="checkbox" id="opt-slow"> Speak slowly</label>
      <label class="check"><input type="checkbox" id="opt-read"> Emma reads her replies aloud</label>
      <label class="check"><input type="checkbox" id="opt-autosend"> Send automatically when I stop speaking</label>
      <p class="hint" id="voice-hint"></p>
    </div>
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="notice" id="notice" hidden></div>
    <div class="chips" id="chips"></div>
    <div class="listening-bar" id="listening" hidden>🎙️ Listening… speak, then tap <b>Stop</b> when you finish.</div>
    <div class="confirm" id="confirm" hidden>
      <span>Send this message?</span>
      <button type="button" class="btn" id="confirm-send">✓ Send</button>
      <button type="button" class="btn secondary" id="confirm-again">🎤 Say it again</button>
      <button type="button" class="btn secondary" id="confirm-edit">✏️ Edit</button>
    </div>
    <div class="login-gate" id="login-gate" hidden>
      <p>Log in or create a free account to talk to Emma.</p>
      <a class="btn" id="gate-login" href="/login">Log in</a>
      <a class="btn secondary" id="gate-signup" href="/login?mode=signup">Create free account</a>
    </div>
    <p class="usage" id="usage" hidden></p>
    <form class="composer" id="composer">
      <button type="button" class="mic-btn" id="mic" title="Speak in English" aria-label="Speak">🎤</button>
      <input id="input" autocomplete="off" maxlength="1000" placeholder="Write in English…" aria-label="Your message">
      <button class="btn" id="send">Send</button>
    </form>
  </div>
</main>
<script src="/lessons-data.js"></script>
<script src="/common.js"></script>
<script src="/chat.js"></script>
</body>
</html>
