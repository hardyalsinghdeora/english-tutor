# One-click setup for Render.com (free plan)
services:
  - type: web
    name: english-with-emma
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false   # Render asks you to paste this secret
