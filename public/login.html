<!doctype html>
<html lang="en">
<head>
<title>Log in</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/avatar.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/"><img src="/avatar.svg" alt=""><span>English with Emma</span></a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/lessons">Lessons</a>
      <a href="/chat">Talk to Emma</a>
    </nav>
  </div>
</header>
<main class="wrap auth-page">
  <section class="card auth-card">
    <img class="auth-avatar" src="/avatar.svg" alt="">
    <h1 id="auth-title">Welcome back!</h1>
    <p class="auth-sub" id="auth-sub">Log in to talk to Emma and save your progress.</p>

    <div class="signed-in" id="signed-in" hidden>
      <p>You are logged in as <b id="signed-in-name"></b>.</p>
      <a class="btn" id="continue" href="/">Continue</a>
      <button class="btn secondary" id="logout" type="button">Log out</button>
    </div>

    <div id="auth-forms">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">Create account</button>
      </div>

      <a class="google-btn" id="google" href="/auth/google" hidden>
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </a>
      <div class="or" id="or" hidden><span>or</span></div>

      <form id="form" novalidate>
        <label class="field" id="name-field" hidden>Your name
          <input id="name" name="name" autocomplete="name" maxlength="60">
        </label>
        <label class="field">Email
          <input id="email" name="email" type="email" autocomplete="email" maxlength="200" required>
        </label>
        <label class="field">Password
          <span class="password">
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="200" required>
            <button type="button" class="show-pw" id="show-pw" aria-label="Show password">Show</button>
          </span>
          <small class="hint" id="pw-hint" hidden>At least 8 characters.</small>
        </label>
        <p class="form-error" id="error" role="alert" hidden></p>
        <button class="btn wide" id="submit" type="submit">Log in</button>
      </form>
      <p class="auth-note">Lessons and videos are free for everyone. An account lets you talk to Emma and keeps your progress on every device.</p>
    </div>
  </section>
</main>
<script src="/common.js"></script>
<script src="/login.js"></script>
</body>
</html>
